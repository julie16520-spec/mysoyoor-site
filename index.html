<link rel="icon" href="favicon.png">
<link rel="preload" href="assets/fonts/plex-mono-500.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<body>
<a class="skip" href="#works">본문으로 건너뛰기</a>

<header class="bar">
  <a class="logo" href="./" aria-label="SOYO 처음으로">SOYO</a>
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu">
    <span>Menu</span><i class="checker" aria-hidden="true"></i>
  </button>
</header>

<nav id="menu" class="menu" aria-label="사이트 메뉴" hidden>
  <a href="#works">작업</a>
  <a href="#contact">연락</a>
  <p class="menu-foot">contact@mysoyoor.com</p>
</nav>

<main>
  <!-- 1. 흰 화면: 칸칸 고양이 모양 물방울 안으로 앱 화면이 비친다 -->
  <section class="intro" aria-label="SOYO">
    <canvas id="blob" aria-hidden="true"></canvas>
    <h1 class="visually-hidden">SOYO 소요</h1>
  </section>

  <!-- 2. 검은 화면: 입체 칸칸 고양이 둘레로 앱 화면 카드가 돈다 (스크롤로 회전) -->
  <section class="orbit" id="orbit" aria-label="작업 화면">
    <div class="orbit-stick">
      <canvas id="scene" aria-hidden="true"></canvas>
    </div>
  </section>

  <!-- 3. 작업: 분류 탭 + 큰 이름 줄. 마우스를 올리면 그 작업 그림이 따라온다. 목록은 assets/works.js 에 -->
  <section class="works" id="works" aria-labelledby="works-title">
    <h2 id="works-title" class="works-title">작업</h2>
    <div class="tabs" role="toolbar" aria-label="작업 분류"></div>
    <ol class="app-list" aria-live="polite"></ol>
    <img class="follow" alt="" aria-hidden="true">
  </section>

  <!-- 5. 연락 -->
  <section class="contact" id="contact" aria-labelledby="contact-title">
    <h2 id="contact-title" class="visually-hidden">연락</h2>
    <a class="mail" href="mailto:contact@mysoyoor.com">contact@<br>mysoyoor.com</a>
    <dl class="facts">
      <dt>상호</dt><dd>소요 (SOYO)</dd>
      <dt>대표</dt><dd>조진석</dd>
      <dt>사업자등록번호</dt><dd>443-13-03295</dd>
      <dt>업태</dt><dd>정보통신업, 미디어콘텐츠창작업</dd>
    </dl>
  </section>
</main>

<footer class="foot">
  <span>© 2026 SOYO</span>
  <a href="https://julie16520-spec.github.io/nojudgeman-legal/privacy">노저지맨 개인정보처리방침</a>
</footer>

<script src="assets/works.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
